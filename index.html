<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scientific Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDF1F7; --panel:#FFFFFF; --display-bg:#FFFFFF; --grid-line:rgba(16,30,55,.055);
    --text:#10192B; --text-dim:#5C6B85; --accent:#0E9488; --accent-text:#FFFFFF;
    --num-bg:#FFFFFF; --num-text:#10192B;
    --fn-bg:#E2E8F4; --fn-text:#1F3358; --fn-bg-active:#0E9488; --fn-text-active:#FFFFFF;
    --op-bg:#D8E4F5; --op-text:#0E6B86;
    --border:rgba(16,25,43,.09);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0E1420; --panel:#141B2B; --display-bg:#0A101B; --grid-line:rgba(255,255,255,.045);
      --text:#E8EDF5; --text-dim:#7C8AA3; --accent:#4DD8C4; --accent-text:#0A1420;
      --num-bg:#1C2436; --num-text:#E8EDF5;
      --fn-bg:#202A42; --fn-text:#9FB3D9; --fn-bg-active:#4DD8C4; --fn-text-active:#0A1420;
      --op-bg:#233249; --op-text:#4DD8C4;
      --border:rgba(255,255,255,.07);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1420; --panel:#141B2B; --display-bg:#0A101B; --grid-line:rgba(255,255,255,.045);
    --text:#E8EDF5; --text-dim:#7C8AA3; --accent:#4DD8C4; --accent-text:#0A1420;
    --num-bg:#1C2436; --num-text:#E8EDF5;
    --fn-bg:#202A42; --fn-text:#9FB3D9; --fn-bg-active:#4DD8C4; --fn-text-active:#0A1420;
    --op-bg:#233249; --op-text:#4DD8C4;
    --border:rgba(255,255,255,.07);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
    background:
      repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 28px),
      var(--bg);
    color:var(--text);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .calc-wrap{
    min-height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:20px 14px;
  }
  .calc{
    width:100%; max-width:380px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:16px;
    box-shadow:0 20px 40px rgba(10,16,28,.12);
  }
  .mode-row{display:flex; justify-content:flex-end; margin-bottom:10px;}
  .mode-toggle{display:flex; background:var(--fn-bg); border-radius:10px; padding:3px; gap:3px;}
  .mode-btn{
    border:none; background:transparent; color:var(--fn-text);
    font-family:inherit; font-size:12px; font-weight:600; letter-spacing:.04em;
    padding:6px 12px; border-radius:7px; cursor:pointer;
  }
  .mode-btn.active{background:var(--fn-bg-active); color:var(--fn-text-active);}
  .display{
    background:var(--display-bg);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 14px 14px;
    text-align:right;
    margin-bottom:14px;
  }
  .expr{
    color:var(--text-dim); font-size:14px; min-height:18px;
    overflow-x:auto; white-space:nowrap; margin-bottom:6px;
  }
  .expr::-webkit-scrollbar{display:none;}
  .result{
    font-size:30px; font-weight:600; line-height:1.15; min-height:1.15em;
    overflow-x:auto; white-space:nowrap;
  }
  .result::-webkit-scrollbar{display:none;}
  .keys{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .key{
    font-family:inherit; font-size:16px; font-weight:500;
    border:none; border-radius:11px; padding:14px 0;
    cursor:pointer; color:var(--text);
    transition:transform .08s ease, filter .12s ease;
  }
  .key:active{transform:scale(.95);}
  .key:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .key-num{background:var(--num-bg); color:var(--num-text);}
  .key-fn{background:var(--fn-bg); color:var(--fn-text); font-size:14px;}
  .key-fn.active{background:var(--fn-bg-active); color:var(--fn-text-active);}
  .key-op{background:var(--op-bg); color:var(--op-text); font-weight:600;}
  .key-eq{background:var(--accent); color:var(--accent-text); font-weight:700;}
  @media (prefers-reduced-motion:reduce){ .key{transition:none;} }
</style>
</head>
<body>
<div class="calc-wrap">
  <div class="calc">
    <div class="mode-row">
      <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn active" data-mode="deg" type="button">DEG</button>
        <button class="mode-btn" data-mode="rad" type="button">RAD</button>
      </div>
    </div>
    <div class="display">
      <div class="expr" id="expr">0</div>
      <div class="result" id="result">0</div>
    </div>
    <div class="keys" id="keys"></div>
  </div>
</div>
<script>
(function(){
  "use strict";
  var state = { expr: "", inv: false, mode: "deg", secretMode: false, keyLog: "" };
  var exprEl = document.getElementById("expr");
  var resultEl = document.getElementById("result");
  var keysEl = document.getElementById("keys");

  var rows = [
    [{l:"INV",t:"inv"},{l:"sin",t:"trig",v:"sin"},{l:"cos",t:"trig",v:"cos"},{l:"tan",t:"trig",v:"tan"}],
    [{l:"(",t:"ins",v:"("},{l:")",t:"ins",v:")"},{l:"^",t:"ins",v:"^"},{l:"\u221A",t:"ins",v:"\u221A("}],
    [{l:"\u03C0",t:"ins",v:"\u03C0"},{l:"e",t:"ins",v:"e"},{l:"ln",t:"ins",v:"ln("},{l:"log",t:"ins",v:"log("}],
    [{l:"AC",t:"ac"},{l:"\u232B",t:"del"},{l:"%",t:"ins",v:"%"},{l:"\u00F7",t:"ins",v:"\u00F7",op:true}],
    [{l:"7",t:"ins",v:"7"},{l:"8",t:"ins",v:"8"},{l:"9",t:"ins",v:"9"},{l:"\u00D7",t:"ins",v:"\u00D7",op:true}],
    [{l:"4",t:"ins",v:"4"},{l:"5",t:"ins",v:"5"},{l:"6",t:"ins",v:"6"},{l:"\u2212",t:"ins",v:"\u2212",op:true}],
    [{l:"1",t:"ins",v:"1"},{l:"2",t:"ins",v:"2"},{l:"3",t:"ins",v:"3"},{l:"+",t:"ins",v:"+",op:true}],
    [{l:"0",t:"ins",v:"0",span:2},{l:".",t:"ins",v:"."},{l:"=",t:"eq"}]
  ];

  var invBtn = null, trigBtns = [];

  function variantFor(k){
    if (k.t === "eq") return "key-eq";
    if (k.t === "ins" && /^[0-9.]$/.test(k.v)) return "key-num";
    if (k.op) return "key-op";
    return "key-fn";
  }
  function labelFor(k){
    if (k.t === "trig") return state.inv ? "a" + k.v : k.v;
    return k.l;
  }

  rows.forEach(function(row){
    row.forEach(function(k){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "key " + variantFor(k);
      if (k.span) btn.style.gridColumn = "span " + k.span;
      btn.textContent = labelFor(k);
      btn.addEventListener("click", function(){ handle(k); });
      if (k.t === "inv") invBtn = btn;
      if (k.t === "trig") trigBtns.push({btn:btn, k:k});
      keysEl.appendChild(btn);
    });
  });

  function handle(k){
    if (k.t === "ac"){ state.expr = ""; render(); return; }
    if (k.t === "del"){ state.expr = state.expr.slice(0,-1); render(); return; }
    if (k.t === "inv"){
      state.inv = !state.inv;
      invBtn.classList.toggle("active", state.inv);
      trigBtns.forEach(function(o){ o.btn.textContent = labelFor(o.k); });
      return;
    }
    if (k.t === "trig"){
      state.expr += (state.inv ? "a" + k.v : k.v) + "(";
      render(); return;
    }
    if (k.t === "eq"){ onEquals(); return; }
    state.expr += k.v;
    render();
  }

  var FUNC_NAMES = ["asin","acos","atan","sqrt","sin","cos","tan","ln","log"];

  function tokenize(s){
    var tokens = [], i = 0;
    while (i < s.length){
      var c = s[i];
      if (c === " "){ i++; continue; }
      if ("+-*/^()%".indexOf(c) !== -1){ tokens.push(c); i++; continue; }
      if (c === "\u00D7"){ tokens.push("*"); i++; continue; }
      if (c === "\u00F7"){ tokens.push("/"); i++; continue; }
      if (c === "\u2212"){ tokens.push("-"); i++; continue; }
      if (c === "\u221A"){ tokens.push("sqrt"); i++; continue; }
      if (c === "\u03C0"){ tokens.push("pi"); i++; continue; }
      if (/[0-9.]/.test(c)){
        var j = i;
        while (j < s.length && /[0-9.]/.test(s[j])) j++;
        tokens.push(parseFloat(s.slice(i,j))); i = j; continue;
      }
      if (/[a-zA-Z]/.test(c)){
        var found = null;
        for (var f = 0; f < FUNC_NAMES.length; f++){
          var name = FUNC_NAMES[f];
          if (s.slice(i, i+name.length) === name){ found = name; break; }
        }
        if (found){ tokens.push(found); i += found.length; continue; }
        if (c === "e"){ tokens.push("e"); i++; continue; }
        throw new Error("bad token");
      }
      throw new Error("bad char");
    }
    return tokens;
  }

  function evaluate(str, mode){
    var tokens = tokenize(str), pos = 0;
    function peek(){ return tokens[pos]; }
    function take(){ return tokens[pos++]; }
    function toRad(x){ return mode === "deg" ? x*Math.PI/180 : x; }
    function fromRad(x){ return mode === "deg" ? x*180/Math.PI : x; }
    var FUNCS = {
      sin:function(x){return Math.sin(toRad(x));}, cos:function(x){return Math.cos(toRad(x));}, tan:function(x){return Math.tan(toRad(x));},
      asin:function(x){return fromRad(Math.asin(x));}, acos:function(x){return fromRad(Math.acos(x));}, atan:function(x){return fromRad(Math.atan(x));},
      ln:Math.log, log:Math.log10, sqrt:Math.sqrt
    };
    function parseExpr(){
      var v = parseTerm();
      while (peek() === "+" || peek() === "-"){ var op = take(); var r = parseTerm(); v = op === "+" ? v+r : v-r; }
      return v;
    }
    function parseTerm(){
      var v = parsePower();
      while (peek() === "*" || peek() === "/"){ var op = take(); var r = parsePower(); v = op === "*" ? v*r : v/r; }
      return v;
    }
    function parsePower(){
      var v = parseUnary();
      if (peek() === "^"){ take(); var r = parsePower(); v = Math.pow(v, r); }
      return v;
    }
    function parseUnary(){
      if (peek() === "-"){ take(); return -parseUnary(); }
      if (peek() === "+"){ take(); return parseUnary(); }
      return parsePostfix();
    }
    function parsePostfix(){
      var v = parsePrimary();
      while (peek() === "%"){ take(); v = v/100; }
      return v;
    }
    function parsePrimary(){
      var t = peek();
      if (t === undefined) throw new Error("eof");
      if (t === "("){ take(); var v = parseExpr(); if (peek() !== ")") throw new Error("paren"); take(); return v; }
      if (typeof t === "number"){ take(); return t; }
      if (t === "pi"){ take(); return Math.PI; }
      if (t === "e"){ take(); return Math.E; }
      if (FUNCS[t]){ take(); if (peek() !== "(") throw new Error("fnparen"); take(); var v2 = parseExpr(); if (peek() !== ")") throw new Error("paren"); take(); return FUNCS[t](v2); }
      throw new Error("token");
    }
    var result = parseExpr();
    if (pos !== tokens.length) throw new Error("trailing");
    return result;
  }

  function autoClose(s){
    var open = 0;
    for (var i=0;i<s.length;i++){ if (s[i]==="(") open++; else if (s[i]===")") open--; }
    return s + ")".repeat(Math.max(0, open));
  }
  function formatNum(n){
    if (!isFinite(n)) return "Error";
    if (Math.abs(n) < 1e-12) n = 0;
    var r = parseFloat(n.toPrecision(12));
    if (Math.abs(r) >= 1e12 || (Math.abs(r) < 1e-9 && r !== 0)) return r.toExponential(6).replace("+","");
    return r.toString();
  }
  function livePreview(){
    if (!state.expr) return "";
    try { return formatNum(evaluate(autoClose(state.expr), state.mode)); }
    catch(e){ return ""; }
  }
  function render(){
    exprEl.textContent = state.expr || "0";
    var p = livePreview();
    resultEl.textContent = p !== "" ? p : (state.expr ? " " : "0");
  }
  function onEquals(){
    if (state.secretMode){
      console.log("test");
      state.secretMode = false;
      return;
    }
    if (!state.expr) return;
    if (state.expr === "(()())"){
      state.secretMode = true;
      resultEl.textContent = "Error";
      return;
    }
    try {
      var val = evaluate(autoClose(state.expr), state.mode);
      state.expr = formatNum(val);
    } catch(e){
      resultEl.textContent = "Error";
      return;
    }
    render();
  }

  document.getElementById("modeToggle").addEventListener("click", function(e){
    var btn = e.target.closest(".mode-btn");
    if (!btn) return;
    state.mode = btn.dataset.mode;
    document.querySelectorAll(".mode-btn").forEach(function(b){ b.classList.toggle("active", b === btn); });
    render();
  });

  document.addEventListener("keydown", function(e){
    var k = e.key;
    if (state.secretMode){
      if (k === "Enter" || k === "="){ e.preventDefault(); onEquals(); return; }
      if (k === "Backspace"){ state.keyLog = state.keyLog.slice(0,-1); return; }
      if (k.length === 1){ var ch = k.toLowerCase(); if (ch === ";") ch = ":"; state.keyLog += ch; return; }
      return;
    }
    if (/[0-9.]/.test(k)){ state.expr += k; render(); return; }
    if (k === "+"){ state.expr += "+"; render(); return; }
    if (k === "-"){ state.expr += "\u2212"; render(); return; }
    if (k === "*"){ state.expr += "\u00D7"; render(); return; }
    if (k === "/"){ e.preventDefault(); state.expr += "\u00F7"; render(); return; }
    if (k === "^"){ state.expr += "^"; render(); return; }
    if (k === "("){ state.expr += "("; render(); return; }
    if (k === ")"){ state.expr += ")"; render(); return; }
    if (k === "%"){ state.expr += "%"; render(); return; }
    if (k === "Enter" || k === "="){ e.preventDefault(); onEquals(); return; }
    if (k === "Backspace"){ state.expr = state.expr.slice(0,-1); render(); return; }
    if (k === "Escape"){ state.expr = ""; render(); return; }
  });

  render();
})();
</script>
</body>
</html>
